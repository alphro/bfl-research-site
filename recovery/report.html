<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>BFL — Donor and cause recovery</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#253b2e;font:15px system-ui}header{padding:12px 22px;border-bottom:1px solid #bbc9bc;background:#f4f3ee}a{color:#245b49}.top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.dataset-tabs{display:flex;gap:8px}button{font:inherit;padding:11px 22px;background:white;border:2px solid #245b49;border-radius:6px;color:#245b49;cursor:pointer}button[aria-selected=true]{background:#245b49;color:white;font-weight:700}button:focus-visible{outline:3px solid #bd842b;outline-offset:3px}.views{display:flex;gap:8px;margin-top:8px}.views button{padding:6px 14px;border-width:1px}#context{margin:9px 0 0;font-size:13px}iframe{display:block;width:100%;height:calc(100vh - 162px);min-height:650px;border:0;background:#f4f3ee}@media(max-width:700px){header{padding:10px}.top{gap:10px}iframe{height:calc(100vh - 210px)}}</style></head><body><header><div class="top"><div aria-label="Dataset" class="dataset-tabs" role="tablist"><button aria-controls="content" data-dataset="PHMRC" id="dataset-phmrc" role="tab">PHMRC</button><button aria-controls="content" data-dataset="CHAMPS" id="dataset-champs" role="tab">CHAMPS</button></div><strong>Donor &amp; cause recovery</strong><a href="../index.html" target="_top">← BFL Home</a></div><div aria-label="Report view" class="views" role="tablist"><button aria-controls="content" data-view="report" role="tab">Recovery &amp; diagnostics</button><button aria-controls="content" data-view="explorer" role="tab">Interactive error explorer</button></div><p aria-live="polite" id="context"></p></header><iframe id="content" title="Dataset recovery report"></iframe><script>
const CFG={"urls":{"PHMRC":{"report":"phmrc.html","explorer":"phmrc_explorer.html"},"CHAMPS":{"report":"champs.html","explorer":"champs_explorer.html"}},"defaultDataset":"CHAMPS","defaultView":"report"},q=new URLSearchParams(location.search);let dataset=['PHMRC','CHAMPS'].includes(q.get('dataset'))?q.get('dataset'):CFG.defaultDataset,view=['report','explorer'].includes(q.get('view'))?q.get('view'):CFG.defaultView;
function render(){document.querySelectorAll('[data-dataset]').forEach(b=>{let on=b.dataset.dataset===dataset;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});document.querySelectorAll('[data-view]').forEach(b=>{let on=b.dataset.view===view;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});document.getElementById('content').src=CFG.urls[dataset][view];document.getElementById('content').title=dataset+' '+(view==='report'?'recovery and diagnostics':'interactive error explorer');document.getElementById('context').textContent=dataset==='PHMRC'?'PHMRC · 34 causes · 6 donor sources · 1,563 target / 313 revealed / 1,250 hidden · 165 symptom-only donor pilot (not the paper168 experiment)':'CHAMPS · 8 causes · 7 donor sources · 314 target / 63 revealed / 251 hidden · 353 original inputs';document.title='BFL — '+dataset+' donor and cause recovery';try{history.replaceState(null,'','?dataset='+dataset+'&view='+view)}catch(e){}}
document.querySelectorAll('[data-dataset]').forEach(b=>b.addEventListener('click',()=>{dataset=b.dataset.dataset;render()}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));document.querySelectorAll('[role=tablist]').forEach(list=>list.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const bs=[...list.querySelectorAll('button')];let i=bs.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[i].click();bs[i].focus()}));render();
</script></body></html>
